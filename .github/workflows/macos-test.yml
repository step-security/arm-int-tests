name: MacOSLatest

on:
  workflow_dispatch:

        
jobs:
  enum:
    runs-on: macos-latest
    steps:

          
      - uses: h0x0er/harden-runner@exp/mac-agent
        with:
          egress-policy: audit

      - uses: actions/checkout@main

      - run: curl https://www.google.com
      - run: dig bing.com
      - run: dig youtube.com
      - run: curl http://yahoo.com
      # - run: dig +tcp apple.com # tcp is not available

      - name: echo overwrite
        run: echo "overwrite" >> source.js

      - name: copy overwrite
        run: | 
          echo "overwrite" > source.js2
          cp source.js2 source.js

      - name: mv overwrite
        run: | 
          echo "overwrite" > source.js3
          mv source.js3 source.js

