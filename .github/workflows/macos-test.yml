name: MacOSLatest

on:
  workflow_dispatch:

        
jobs:
  enum:
    runs-on: macos-latest
    steps:

          
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: h0x0er/harden-runner@cb6fbdacfe38ac99d337e34c641437afc019fde0 # exp/mac-agent
        with:
          egress-policy: audit

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main

      - run: curl https://www.google.com
      - run: dig bing.com
      - run: dig youtube.com
      - run: curl http://yahoo.com
      # - run: dig +tcp apple.com # tcp is not available

      - name: echo overwrite
        run: echo "overwrite" >> source.js

      - name: copy overwrite
        run: | 
          echo "overwrite" > source.js2
          cp source.js2 source.js

      - name: mv overwrite
        run: | 
          echo "overwrite" > source.js3
          mv source.js3 source.js

