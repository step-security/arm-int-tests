name: Policy Store - Repo Level (ARM)

on: 
  workflow_dispatch:
    inputs:
      ami-id:
        description: 'AMI ID to use for the runners'
        required: true

jobs:
  repo-level-policy:
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=2cpu-linux-arm64
      - ami=${{ inputs.ami-id }}

    steps:
      # - name: Harden the runner
      #   uses: step-security/harden-runner@feature/policy-store
      #   with:
      #     use-policy-store: true
      #     api-key: ${{ secrets.STEP_SECURITY_API_KEY }}
      - name: Checkout code
        uses: actions/checkout@v4

      - name: call google
        run: |
          curl https://google.com

      - name: call bing
        run: |
          curl https://bing.com

      - name: call microsoft
        run: |
          curl https://microsoft.com

      - name: call amazon
        run: |
          curl https://amazon.com
